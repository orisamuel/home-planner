<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f6f1ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>הבית שלנו</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261029e">
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}
</script>
<script src="config.js?v=20261029e"></script>
</head>
<body>

<!-- gate: house code + who am I -->
<section class="gate hidden" id="gate">
  <div class="gate-card">
    <h1>הבית שלנו</h1>
    <p id="gateHint">מקלידים את קוד הבית פעם אחת, והטלפון זוכר.</p>
    <div class="field"><label for="code">קוד הבית</label><input class="input" id="code" type="password" autocomplete="current-password"></div>
    <div class="field hidden" id="code2Wrap"><label for="code2">שוב, לאימות</label><input class="input" id="code2" type="password" autocomplete="new-password"></div>
    <div class="field"><label>מי את/ה?</label>
      <div class="who"><button type="button" data-who="ori">אורי</button><button type="button" data-who="rani">רני</button></div>
    </div>
    <button class="btn" id="enter" disabled>כניסה</button>
    <div class="err" id="gateErr"></div>
  </div>
</section>

<!-- the house -->
<div class="app hidden" id="app">
  <canvas id="c3d" aria-label="הבית בתלת ממד"></canvas>
  <div class="labels" id="labels"></div>
  <div class="loading" id="loading"><div class="spin"></div><span>בונים את הבית…</span></div>

  <header class="top" id="top">
    <div class="ttl"><h1>הבית שלנו</h1><div class="sync" id="sync">מתעדכן…</div></div>
    <div class="top-l">
      <button class="pill" id="pill" aria-label="תקציב"><span id="pillPaid">₪0</span><span class="of hidden">מתוך</span><span id="pillTotal"></span></button>
      <button class="me" id="me" aria-label="החלפת משתמש"></button>
    </div>
  </header>

  <div class="tools" id="tools">
    <button class="round hidden" id="homeBtn" aria-label="כל הבית" title="כל הבית">⌂</button>
    <button class="round" id="layerBtn" aria-label="שכבות" title="שכבות">◫</button>
    <button class="round" id="sunBtn" aria-label="שעה ביום" title="שעה ביום">☀</button>
  </div>
  <div class="pop hidden" id="layerPop">
    <div class="pop-t">מה רואים על התוכנית</div>
    <div class="layers" id="layers">
      <button data-layer="none" class="on">בלי</button>
      <button data-layer="lights">💡 נקודות תאורה</button>
      <button data-layer="electric">🔌 חשמל</button>
      <button data-layer="plumbing">💧 אינסטלציה</button>
      <button data-layer="plan">📐 מידות</button>
    </div>
  </div>
  <div class="pop hidden" id="sunPop">
    <div class="row"><span class="time" id="tlabel">10:00</span><input type="range" id="t" min="6" max="22" step="0.25" value="10" aria-label="שעה ביום"></div>
    <div class="seg2" id="season"><button data-d="355" class="on">דצמבר</button><button data-d="172">יוני</button></div>
  </div>

  <section class="sheet" id="sheet" aria-live="polite">
    <div class="grab" id="grab"><span></span></div>
    <div class="sh-body" id="shBody"></div>
  </section>
</div>

<!-- add / edit -->
<div class="scrim hidden" id="scrim"></div>
<form class="editor hidden" id="editor" autocomplete="off">
  <h3><span id="edTitle">פריט חדש</span><button type="button" class="x" id="close" aria-label="סגירה">✕</button></h3>
  <div class="field"><label for="fName">מה זה</label><input class="input" id="fName" required placeholder="ספה, מנורה, מקרר…"></div>
  <div class="field"><label for="fRoom">חדר</label><select class="input" id="fRoom"></select></div>
  <div class="field"><label>מצב</label>
    <div class="seg" id="fStatus"><button type="button" data-s="need">צריך</button><button type="button" data-s="chosen">בחרנו</button><button type="button" data-s="bought">קנינו</button></div>
  </div>
  <div class="two">
    <div class="field"><label for="fPlanned">מחיר משוער ₪</label><input class="input" id="fPlanned" inputmode="numeric"></div>
    <div class="field" id="paidWrap"><label for="fPaid">שולם בפועל ₪</label><input class="input" id="fPaid" inputmode="numeric"></div>
  </div>
  <div class="field"><label>תמונה</label>
    <div class="photo-pick"><div class="ph" id="fPhotoPrev">📷</div>
      <input type="file" id="fPhoto" accept="image/*" class="hidden">
      <button type="button" class="btn ghost" id="pickPhoto">צילום או גלריה</button></div>
  </div>
  <div class="field"><label for="fLink">קישור למוצר</label><input class="input" id="fLink" inputmode="url" dir="ltr" placeholder="הדבקה מהאתר של החנות"></div>
  <details class="more" id="more"><summary>עוד פרטים</summary>
    <div class="two">
      <div class="field"><label for="fCat">קטגוריה</label><select class="input" id="fCat"></select></div>
      <div class="field"><label for="fQty">כמות</label><input class="input" id="fQty" inputmode="numeric"></div>
    </div>
    <label class="check"><input type="checkbox" id="fBefore"> חייב להיות בבית ביום הכניסה</label>
    <div class="field"><label for="fStore">חנות</label><input class="input" id="fStore"></div>
    <div class="field"><label for="fNote">הערה</label><input class="input" id="fNote"></div>
  </details>
  <div class="actions">
    <button class="btn" id="save" type="submit">שמירה</button>
    <button class="del hidden" id="del" type="button">מחיקת הפריט</button>
  </div>
</form>

<input type="file" id="quickPhoto" accept="image/*" class="hidden">
<div class="toast hidden" id="toast" role="status"></div>
<script src="app.js?v=20261029e"></script>
</body>
</html>
